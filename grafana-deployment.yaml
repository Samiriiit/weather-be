# --- 1. Grafana Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          # Define resource requests/limits for stability and HPA readiness
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            # Set default password (must be changed immediately after first login)
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin1234
            # Optionally disable authentication for testing/dev (NOT recommended for production)
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        # Define a Persistent Volume Claim (PVC) if persistent storage is required
        # For this basic setup, we'll use an emptyDir; replace with a PVC for persistence
        - name: grafana-storage
          emptyDir: {}

---
# --- 2. Grafana Service (LoadBalancer) ---
# Exposes Grafana externally via an AWS Load Balancer
apiVersion: v1
kind: Service
metadata:
  name: grafana-service-lb
  labels:
    app: grafana
  annotations:
    # Use classic LoadBalancer for quick deployment
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb" 
spec:
  selector:
    app: grafana
  type: LoadBalancer # This creates an external LoadBalancer in AWS
  ports:
    - port: 80
      targetPort: 3000 # Grafana listens on port 3000
      protocol: TCP
